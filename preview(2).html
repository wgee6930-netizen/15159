<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Trajectory</title>
<style>
:root{--bg:#0d1117;--sf:#161B22;--cd:#1C2333;--bd:#30363D;--cy:#00D4FF;--gn:#00FF88;--rd:#FF3344;--t1:#E6EDF3;--t2:#8B949E;--dm:#484F58}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:-apple-system,Helvetica Neue,Segoe UI,Arial,sans-serif}
body{display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;overflow:hidden}.screen.active{display:flex}
.tb{height:50px;display:flex;align-items:center;justify-content:center;background:var(--sf);border-bottom:1px solid var(--bd);position:relative;flex-shrink:0}
.tb .n{font-size:17px;font-weight:700}.tb .g{position:absolute;right:16px;font-size:22px;color:var(--cy);cursor:pointer;padding:6px;user-select:none}
.hl{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.hi{display:flex;align-items:center;background:var(--cd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.hp{width:56px;height:56px;border-radius:8px;background:var(--bg);flex-shrink:0;overflow:hidden;position:relative}
.hp canvas{position:absolute;inset:0;width:100%;height:100%}
.hf{flex:1;margin-left:12px;overflow:hidden}
.hf .nm{font-size:15px;font-weight:600}.hf .dt{font-size:12px;color:var(--t2);margin-top:3px}.hf .st{font-size:11px;color:var(--dm);margin-top:2px}
.hb{background:var(--sf);padding:16px;text-align:center;flex-shrink:0;border-top:1px solid var(--bd)}
.sbtn{background:var(--gn);color:#000;border:none;font-size:14px;font-weight:700;padding:10px 36px;border-radius:50px;cursor:pointer}
.pw{position:relative;background:var(--bg);flex-shrink:0;overflow:hidden}.pw canvas{display:block;width:100%;height:100%}
.pl{position:absolute;top:4px;left:10px;font-size:9px;color:var(--dm);pointer-events:none;z-index:2}
.dv{height:8px;background:var(--sf);cursor:ns-resize;display:flex;align-items:center;justify-content:center;position:relative;z-index:5;flex-shrink:0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);touch-action:none;user-select:none}
.dv .hd{width:40px;height:3px;border-radius:2px;background:var(--dm)}.dv:hover .hd,.dv.drag .hd{background:var(--cy)}
.dv::before{content:"";position:absolute;top:-14px;bottom:-14px;left:0;right:0}
.mw{position:relative;background:#0d0d12;flex:1;overflow:hidden}.mw canvas{display:block;width:100%;height:100%}
.bb{background:var(--sf);padding:8px 16px 12px;flex-shrink:0;border-top:1px solid var(--bd)}
.ss{display:flex;justify-content:space-around;margin-bottom:4px}.si{text-align:center}
.si .ic{font-size:10px;color:var(--dm)}.si .vl{font-size:14px;font-weight:700}
.hnt{text-align:center;font-size:10px;color:var(--dm)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.ov.show{display:flex}
.dg{background:var(--cd);border-radius:16px;padding:24px;width:min(370px,92vw);animation:fu .25s ease;max-height:85vh;overflow-y:auto}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.dg h2{font-size:18px;margin-bottom:6px}.dg .sb{font-size:12px;color:var(--dm);margin-bottom:14px}
.dg .cy{color:var(--cy);font-weight:700;font-size:13px;margin-top:16px;margin-bottom:8px}
.dg label{font-size:13px;color:var(--t2);display:block;margin-bottom:4px}label small{font-size:10px;color:var(--dm)}
.dg input,.dg select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--t1);font-size:14px;outline:none;margin-bottom:4px}
.dg input:focus{border-color:var(--cy)}.dg .sep{height:1px;background:var(--bd);margin:12px 0}
.dg .row{display:flex;gap:10px;margin-top:16px}
.dg .btn{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}
.bc{background:transparent;color:var(--t2)}.bo{background:var(--cy);color:#000;border-color:var(--cy)}.brd{background:transparent;color:var(--rd);border-color:var(--rd)}
.dfv{font-size:24px;font-weight:700;color:var(--cy);text-align:center;margin:12px 0;padding:14px;background:var(--bg);border-radius:8px}
.snt{font-size:11px;color:var(--dm);margin:-2px 0 10px;font-style:italic}
.pp{position:absolute;z-index:20;background:rgba(28,35,51,.94);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:185px;pointer-events:auto;backdrop-filter:blur(8px);animation:fu .2s ease;touch-action:none;cursor:move}
.pp .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pp .ph .pt{font-size:13px;font-weight:700;color:var(--cy)}.pp .ph .pc{color:var(--dm);cursor:pointer;font-size:16px;padding:2px 6px}
.pp .ir{display:flex;justify-content:space-between;padding:2px 0;gap:12px}
.pp .ir .lb{font-size:11px;color:var(--t2)}.pp .ir .vl{font-size:11px;color:var(--t1);font-weight:600}
.rc{display:none;flex:1;flex-direction:column;overflow:hidden;background:var(--bg)}.rc.active{display:flex}
.rcg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;margin-top:16px}
.rc .card{background:var(--cd);border-radius:12px;padding:14px}
.rc .card .rl{font-size:11px;color:var(--dm)}.rc .card .rv{font-size:22px;font-weight:700;margin-top:4px}
.rbot{background:var(--sf);padding:20px;text-align:center;flex-shrink:0;border-top:1px solid var(--bd);margin-top:auto;display:flex;align-items:center;justify-content:center;gap:20px}
.pbtn{width:80px;height:80px;border-radius:50%;border:3px solid var(--cy);background:transparent;color:var(--cy);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.pbtn.sm{width:60px;height:60px;font-size:12px}
.pbtn.danger{border-color:var(--rd);color:var(--rd)}
.pbtn.gn{border-color:var(--gn);color:var(--gn)}
.cdov{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.5)}.cdov.show{display:flex}
.cdov canvas{position:absolute}.cdov .ct{font-size:80px;font-weight:700;color:var(--rd);z-index:1;pointer-events:none}
.rc-compass{position:relative;width:240px;height:240px;margin:0 auto 10px}
.rc-compass canvas{width:240px;height:240px}
</style>
</head>
<body>
<div class="screen active" id="homeScr">
<div class="tb"><span class="n" id="L_title"></span><span class="g" id="homeGearBtn">⚙</span></div>
<div class="hl" id="hList"></div>
<div class="hb"><button class="sbtn" id="startBtn"></button></div></div>
<div class="screen" id="viewScr">
<div class="tb"><span class="n" id="vTitle"></span><span class="g" id="viewGearBtn">⚙</span></div>
<div class="pw" id="pWrap" style="height:150px"><span class="pl">ALTITUDE PROFILE</span><canvas id="pCvs"></canvas></div>
<div class="dv" id="divider"><div class="hd"></div></div>
<div class="mw" id="mWrap"><canvas id="mCvs"></canvas></div>
<div class="bb"><div class="ss">
<div class="si"><span class="ic" id="L_dist"></span><span class="vl" id="sD"></span></div>
<div class="si"><span class="ic" id="L_asc"></span><span class="vl" id="sA"></span></div>
<div class="si"><span class="ic" id="L_desc"></span><span class="vl" id="sDe"></span></div>
<div class="si"><span class="ic" id="L_dur"></span><span class="vl" id="sDu"></span></div>
</div><div class="hnt" id="L_hint"></div></div></div>
<div class="rc" id="recScr">
<div class="tb"><span class="n" id="L_rec" style="color:var(--cy)"></span></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:16px">
<div class="rc-compass"><canvas id="compCvs" width="480" height="480"></canvas></div>
<div class="rcg">
<div class="card"><div class="rl" id="L_rTime"></div><div class="rv" id="rTime">0:00</div></div>
<div class="card"><div class="rl" id="L_rAlt"></div><div class="rv" id="rAlt">48m</div></div>
<div class="card"><div class="rl" id="L_rDist"></div><div class="rv" id="rDist">0m</div></div>
<div class="card"><div class="rl" id="L_rSteps"></div><div class="rv" id="rSteps">0</div></div>
<div class="card"><div class="rl" id="L_rAsc"></div><div class="rv" id="rAsc">0m</div></div>
<div class="card"><div class="rl" id="L_rDesc"></div><div class="rv" id="rDesc">0m</div></div>
</div></div>
<div class="rbot">
<button class="pbtn" id="pauseBtn" id="L_pause"></button>
<button class="pbtn sm danger" id="cancelBtn" style="display:none"></button>
<button class="pbtn sm gn" id="resumeBtn" style="display:none"></button>
</div></div>
<div class="cdov" id="cDown"><canvas id="cdCvs"></canvas><div class="ct" id="cdNum">3</div></div>
<div class="ov" id="altWarn"><div class="dg"><h2 id="L_awH"></h2>
<div class="sb" id="L_awS"></div><div class="dfv" id="defAltShow">+0.0m</div>
<div class="sb" style="text-align:center"><span id="L_awD"></span> <span id="defAltLabel"></span></div>
<div class="row"><button class="btn brd" id="resetAltBtn"></button><button class="btn bo" id="altWarnOk"></button></div></div></div>
<div class="ov" id="setDlg"><div class="dg"><h2 id="L_sH"></h2>
<div class="cy" id="L_sCal"></div>
<label id="L_sBar"></label>
<input type="text" id="inpP" placeholder="">
<div class="snt" id="sNote"></div>
<div id="convNote" style="font-size:12px;color:#00D4FF;margin:4px 0 8px;min-height:16px"></div>
<div style="font-size:11px;color:var(--dm);margin-bottom:8px;line-height:1.5" id="L_barInfo"></div>
<div style="font-size:12px;color:var(--dm);margin-bottom:10px"><span id="L_sDef"></span> <span id="defPLbl" style="color:var(--cy)">--</span></div>
<div class="sep"></div>
<label id="L_sAlt"></label>
<input type="text" id="inpA" placeholder="">
<div class="sep"></div>
<div class="cy" id="L_sLang"></div>
<select id="langSel"><option value="system" id="L_optSys"></option><option value="zh" id="L_optZh"></option><option value="en" id="L_optEn"></option><option value="de" id="L_optDe"></option></select>
<div class="row"><button class="btn brd" id="rstBtn" style="display:none"></button><button class="btn bc" id="setCancel"></button><button class="btn bo" id="setOk"></button></div></div></div>
<div class="ov" id="saveDlg"><div class="dg"><h2 id="L_svH"></h2>
<label id="L_svL"></label><input type="text" id="saveName" placeholder="">
<div class="row"><button class="btn bc" id="saveCancel"></button><button class="btn bo" id="saveOk"></button></div></div></div>
<script>
'use strict';
var L={
zh:{title:'轨迹记录器',start:'● 开始',dist:'距离',asc:'↑ 上升',desc:'↓ 下降',dur:'⏱ 时长',
hint:'单指移动 | 双指旋转缩放 | 双击重置 | 点击轨迹查看详情',
rec:'记录中…',rTime:'⏱ 时间',rAlt:'海拔',rDist:'距离',rSteps:'步数',rAsc:'↑ 上升',rDesc:'↓ 下降',
pause:'暂停',cancel:'取消',resume:'恢复',
sH:'设置',sCal:'校准',sBar:'气压计',sDef:'默认值:',sAlt:'水平高度 (m)',sLang:'语言',
optSys:'跟随系统',optZh:'中文',optEn:'English',optDe:'Deutsch',
rst:'恢复默认值',setOk:'确定',setChg:'更改',
svH:'保存轨迹',svL:'线路名称',svCancel:'取消',svOk:'确定',
awH:'高度已修改',awS:'当前校准偏移量',awD:'默认值为',awOk:'确定',awRst:'恢复默认值',
sensorOk:'当前传感器',sensorNo:'当前传感器: 无法获取数据',
convPA:'气压 {p} Pa → 海拔 {a} m',convAP:'海拔 {a} m → 气压 {p} Pa',
barInfo:'气压计测量大气压，通过国际标准大气公式换算海拔。\n假设海平面气压 = 101325 Pa，天气变化会导致绝对高度误差 ±30~50m。\n气压计主要用于跟踪相对高度变化（每升高1m，气压约下降12Pa）。\n输入已知高度或当地气压可校准偏差。',
tp:'轨迹点',speed:'速度',alt:'海拔',prog:'进度'},
en:{title:'Trajectory Recorder',start:'● Start',dist:'Distance',asc:'↑ Ascend',desc:'↓ Descend',dur:'⏱ Duration',
hint:'One finger move | Two finger rotate/zoom | Double tap reset | Tap track for details',
rec:'Recording…',rTime:'⏱ Time',rAlt:'Altitude',rDist:'Distance',rSteps:'Steps',rAsc:'↑ Ascend',rDesc:'↓ Descend',
pause:'Pause',cancel:'Cancel',resume:'Resume',
sH:'Settings',sCal:'Calibration',sBar:'Barometer',sDef:'Default:',sAlt:'Horizontal altitude (m)',sLang:'Language',
optSys:'Follow System',optZh:'中文',optEn:'English',optDe:'Deutsch',
rst:'Reset to default',setOk:'OK',setChg:'Apply',
svH:'Save Trajectory',svL:'Route name',svCancel:'Cancel',svOk:'OK',
awH:'Altitude Modified',awS:'Current calibration offset',awD:'Default value:',awOk:'OK',awRst:'Reset to default',
sensorOk:'Sensor',sensorNo:'Sensor: data unavailable',
convPA:'Pressure {p} Pa → Altitude {a} m',convAP:'Altitude {a} m → Pressure {p} Pa',
barInfo:'The barometer measures atmospheric pressure, converted to altitude using the International Standard Atmosphere formula.\nAssumes sea-level pressure = 101325 Pa; weather changes cause absolute altitude error of ±30-50m.\nBarometer is mainly for tracking relative altitude changes (~12 Pa drop per 1m gain).\nEnter known altitude or local pressure to calibrate.',
tp:'Point',speed:'Speed',alt:'Altitude',prog:'Progress'},
de:{title:'Aufzeichner',start:'● Start',dist:'Distanz',asc:'↑ Anstieg',desc:'↓ Abstieg',dur:'⏱ Dauer',
hint:'Ein Finger bewegen | Zwei Finger drehen/zoomen | Doppeltippen Reset | Tippe auf Spur',
rec:'Aufnahme…',rTime:'⏱ Zeit',rAlt:'Höhe',rDist:'Distanz',rSteps:'Schritte',rAsc:'↑ Anstieg',rDesc:'↓ Abstieg',
pause:'Pause',cancel:'Abbrechen',resume:'Fortsetzen',
sH:'Einstellungen',sCal:'Kalibrierung',sBar:'Barometer',sDef:'Standardwert:',sAlt:'Höhe (m)',sLang:'Sprache',
optSys:'System folgen',optZh:'中文',optEn:'English',optDe:'Deutsch',
rst:'Standard wiederherstellen',setOk:'OK',setChg:'Anwenden',
svH:'Spur speichern',svL:'Routenname',svCancel:'Abbrechen',svOk:'OK',
awH:'Höhe geändert',awS:'Aktueller Kalibrierungsoffset',awD:'Standardwert:',awOk:'OK',awRst:'Standard wiederherstellen',
sensorOk:'Sensor',sensorNo:'Sensor: Daten nicht verfügbar',
convPA:'Druck {p} Pa → Höhe {a} m',convAP:'Höhe {a} m → Druck {p} Pa',
barInfo:'Das Barometer misst den Luftdruck und rechnet ihn über die ISA-Formel in Höhe um.\nAnnahme: Meereshöhendruck = 101325 Pa; Wetteränderungen verursachen ±30-50m Fehler.\nHauptsächlich zur Verfolgung relativer Höhenänderungen (~12 Pa pro 1m).\nBekannte Höhe oder lokalen Druck eingeben zur Kalibrierung.',
tp:'Punkt',speed:'Geschw.',alt:'Höhe',prog:'Fortschritt'}
};
var curLang='zh';
var T=function(k){return(L[curLang]&&L[curLang][k])||(L.zh[k])||k};
var Tp=function(k,pa){var s=T(k);for(var p in pa)s=s.replace('{'+p+'}',pa[p]);return s};

function detectLang(){
  var sel=document.getElementById('langSel').value;
  if(sel!=='system')return sel;
  var nav=navigator.language||'zh';
  if(nav.indexOf('en')===0)return'en';
  if(nav.indexOf('de')===0)return'de';
  return'zh';
}

function setLang(lang){
  curLang=lang;
  document.getElementById('L_title').textContent=T('title');
  document.getElementById('startBtn').textContent=T('start');
  document.getElementById('L_dist').textContent=T('dist');
  document.getElementById('L_asc').textContent=T('asc');
  document.getElementById('L_desc').textContent=T('desc');
  document.getElementById('L_dur').textContent=T('dur');
  document.getElementById('L_hint').textContent=T('hint');
  document.getElementById('L_rec').textContent=T('rec');
  document.getElementById('L_rTime').textContent=T('rTime');
  document.getElementById('L_rAlt').textContent=T('rAlt');
  document.getElementById('L_rDist').textContent=T('rDist');
  document.getElementById('L_rSteps').textContent=T('rSteps');
  document.getElementById('L_rAsc').textContent=T('rAsc');
  document.getElementById('L_rDesc').textContent=T('rDesc');
  document.getElementById('pauseBtn').textContent=T('pause');
  document.getElementById('cancelBtn').textContent=T('cancel');
  document.getElementById('resumeBtn').textContent=T('resume');
  document.getElementById('L_sH').textContent=T('sH');
  document.getElementById('L_sCal').textContent=T('sCal');
  document.getElementById('L_sBar').innerHTML=T('sBar')+' <small>(Pa)</small>';
  document.getElementById('L_barInfo').innerHTML=T('barInfo').replace(/\n/g,'<br>');
  document.getElementById('L_sDef').textContent=T('sDef');
  document.getElementById('L_sAlt').innerHTML=T('sAlt')+' <small>(m)</small>';
  document.getElementById('L_sLang').textContent=T('sLang');
  document.getElementById('L_optSys').textContent=T('optSys');
  document.getElementById('L_optZh').textContent=T('optZh');
  document.getElementById('L_optEn').textContent=T('optEn');
  document.getElementById('L_optDe').textContent=T('optDe');
  document.getElementById('rstBtn').textContent=T('rst');
  document.getElementById('setCancel').textContent=T('cancel');
  document.getElementById('L_svH').textContent=T('svH');
  document.getElementById('L_svL').textContent=T('svL');
  document.getElementById('saveCancel').textContent=T('svCancel');
  document.getElementById('saveOk').textContent=T('svOk');
  document.getElementById('L_awH').textContent=T('awH');
  document.getElementById('L_awS').textContent=T('awS');
  document.getElementById('L_awD').textContent=T('awD');
  document.getElementById('altWarnOk').textContent=T('awOk');
  document.getElementById('resetAltBtn').textContent=T('awRst');
  document.documentElement.lang=lang;
}

var fmtD=function(m){return m>=1000?(m/1000).toFixed(2)+'km':Math.round(m)+'m'};
var fmtDur=function(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sc=s%60;return h>0?h+':'+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0'):m+':'+String(sc).padStart(2,'0')};
var niceStep=function(range,px){if(range<=0||px<=0)return 1;var n=Math.max(px/50,1),raw=range/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),norm=raw/mag;return norm<1.5?mag:norm<3.5?2*mag:norm<7.5?5*mag:10*mag};
var spdCol=function(sp,mx){if(mx<=0)return'#00FF88';var t=Math.min(sp/mx,1),r=t<.5?Math.round(t*2*255):255,g=t<.5?255:Math.round(255-(t-.5)*2*255);return'rgb('+r+','+g+',0)'};
var showOv=function(id){document.getElementById(id).classList.add('show')};
var closeOv=function(id){document.getElementById(id).classList.remove('show')};
var showScr=function(id){document.querySelectorAll('.screen,.rc').forEach(function(s){s.classList.remove('active')});document.getElementById(id).classList.add('active')};
var setupC=function(cvs,wrap){var r=wrap.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=r.width*d;cvs.height=r.height*d;var ctx=cvs.getContext('2d');ctx.scale(d,d);return{ctx:ctx,w:r.width,h:r.height}};
var findClosest=function(tr,dist){var ci=0,cd=1e9;tr.pts.forEach(function(p,i){var dd=Math.abs(p.x-dist);if(dd<cd){cd=dd;ci=i}});return ci};
